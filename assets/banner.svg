<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Rian Firnanda Irsyadani</title>
<desc id="desc">Web development, digital operations and public administration. Bengkulu, Indonesia.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#12232D"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#59D9BD"/><stop offset="1" stop-color="#76B9F0"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8BA6BB" opacity=".09"/></pattern>
</defs>
<style>
  .signal{stroke-dasharray:42 650;animation:travel 12s linear infinite}
  .cursor{animation:blink 1.8s steps(1,end) infinite}
  .status{animation:breathe 4s ease-in-out infinite}
  @keyframes travel{to{stroke-dashoffset:-692}}
  @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.signal,.cursor,.status{animation:none}}
</style>
<rect width="1200" height="300" rx="16" fill="url(#bg)"/>
<rect width="1200" height="300" rx="16" fill="url(#dots)"/>
