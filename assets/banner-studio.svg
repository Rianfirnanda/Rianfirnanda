<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Rian Firnanda Irsyadani</title>
<desc id="desc">Information technology and public administration. A navy banner with warm ivory lettering and a simple illustration of code and documents.</desc>
<defs>
