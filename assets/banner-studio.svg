<clipPath id="clip"><rect width="1280" height="360" rx="18"/></clipPath>
</defs>
<style>
.line{stroke-dasharray:26 250;animation:travel 10s linear infinite}
.dot{animation:soft 6s ease-in-out infinite}
@keyframes travel{to{stroke-dashoffset:-276}}
@keyframes soft{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.line,.dot{animation:none}}
</style>
<g clip-path="url(#clip)">
